name: ci-image
on:
  push:
    paths: [ci/Dockerfile, .github/workflows/ci-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ci
          file: ci/Dockerfile
          push: true
          tags: ghcr.io/bashkamen/zsharp-libs-ci:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
