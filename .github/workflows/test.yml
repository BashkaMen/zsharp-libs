name: test
on:
  pull_request:
  workflow_run:
    workflows: [ci-image]
    types: [completed]
permissions:
  contents: read
  packages: read

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/bashkamen/zsharp-libs-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zpg
          POSTGRES_PASSWORD: zpg
          POSTGRES_DB: zpg_test
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      ZPG_URL: host=postgres port=5432 dbname=zpg_test user=zpg password=zpg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: ci/test.sh
